[project]
name = "personal-knowledge-agent"
version = "0.1.0"
description = "Conversational multi-turn knowledge agent with RAG, citations, and persistent memory."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "mraheja" },
]
dependencies = [
    # LLM + embeddings (raw SDKs used by scripts/verify_apis.py)
    "google-generativeai>=0.8.0",
    "openai>=1.40.0",
    # LangChain provider wrappers used by src/providers/
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    # Used by src/providers/ollama.py and Settings.has_ollama probe
    "requests>=2.31.0",
    # Agent framework
    "crewai>=0.51.0",
    "crewai-tools>=0.8.0",
    # Vector + session storage (Phase 1)
    "chromadb>=0.5.0",
    # Phase 1.3 retrieval: BM25 keyword reranking (pure-Python, local, no API calls)
    "rank-bm25>=0.2.1",
    # Data models / settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # REST API (Phase 0 web layer)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Phase 1.1 ingestion: PDF reading, DOCX read/write, and reportlab so
    # test fixtures can synthesize PDFs without external binaries.
    "pypdf>=3.17.0",
    "python-docx>=0.8.11",
    "reportlab>=4.0.0",
    # Phase 1.1 OCR (scanned PDFs). Python bindings only — the system
    # binaries `tesseract` and `poppler` must be installed separately:
    #   macOS:  brew install tesseract poppler
    #   Linux:  apt-get install tesseract-ocr poppler-utils
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.3",
    "Pillow>=10.0.0",
    # Logging
    "python-json-logger>=2.0.7",
    # Env loading
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
pka = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: requires external services / API keys",
    "slow: takes >1 second",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
